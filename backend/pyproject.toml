[project]
name = "resume-generator-backend"
version = "0.1.0"
description = "FastAPI backend for an AI resume generator with mandatory PDF output."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "celery>=5.4.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pdfplumber>=0.11.4",
    "playwright>=1.46.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "pypdf>=4.3.1",
    "python-multipart>=0.0.9",
    "redis>=5.0.8",
    "reportlab>=4.2.2",
    "sqlalchemy[asyncio]>=2.0.32",
    "uvicorn[standard]>=0.30.5"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
